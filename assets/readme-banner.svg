<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">GPU-Aware Kubernetes Model Serving</title>
  <desc id="desc">A banner illustration for the GPU-aware Kubernetes model serving project, showing a FastAPI service, Kubernetes cluster, and NVIDIA GPU monitoring.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#081b2b"/>
      <stop offset="100%" stop-color="#102d46"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#1d4f7a"/>
      <stop offset="100%" stop-color="#2f6fb5"/>
    </linearGradient>
    <linearGradient id="gpu" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#7df9ff"/>
      <stop offset="100%" stop-color="#4ad3ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)" rx="18"/>
  <rect x="30" y="30" width="1140" height="160" rx="18" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.18)"/>

  <text x="70" y="102" fill="#eaf6ff" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">GPU-Aware</text>
  <text x="70" y="146" fill="#8fe3ff" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700">Kubernetes Model Serving</text>
  <text x="70" y="175" fill="#d8ebf8" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500">FastAPI • Hugging Face • NVIDIA GPU metrics</text>

  <g filter="url(#shadow)">
    <rect x="630" y="58" width="140" height="72" rx="12" fill="url(#panel)"/>
    <text x="700" y="92" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Kubernetes</text>
    <text x="700" y="113" text-anchor="middle" fill="#dff4ff" font-family="Segoe UI, Arial, sans-serif" font-size="12">cluster</text>

    <rect x="790" y="58" width="140" height="72" rx="12" fill="#1a8c76"/>
    <text x="860" y="92" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">FastAPI</text>
    <text x="860" y="113" text-anchor="middle" fill="#dffaf5" font-family="Segoe UI, Arial, sans-serif" font-size="12">service</text>

    <rect x="950" y="58" width="140" height="72" rx="12" fill="#245b9d"/>
    <text x="1020" y="92" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Model</text>
    <text x="1020" y="113" text-anchor="middle" fill="#dfefff" font-family="Segoe UI, Arial, sans-serif" font-size="12">HF + CUDA</text>

    <rect x="790" y="146" width="300" height="30" rx="10" fill="#2c3f66"/>
    <text x="940" y="167" text-anchor="middle" fill="#dfefff" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Prometheus + DCGM</text>

    <rect x="740" y="123" width="30" height="70" rx="8" fill="url(#gpu)"/>
    <rect x="760" y="130" width="30" height="70" rx="8" fill="url(#gpu)"/>
    <rect x="780" y="137" width="30" height="70" rx="8" fill="url(#gpu)"/>
    <text x="770" y="170" text-anchor="middle" fill="#08314a" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">GPU</text>
  </g>

  <g stroke="#7ad8ff" stroke-width="3" fill="none" opacity="0.85">
    <path d="M770 95 H790"/>
    <path d="M930 95 H950"/>
    <path d="M860 130 V146"/>
    <path d="M790 130 Q770 125 770 118"/>
    <path d="M850 130 Q880 128 940 128"/>
  </g>
</svg>
