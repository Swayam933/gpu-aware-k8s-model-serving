apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-model-serving
  namespace: ml-serving
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-model-serving
  template:
    metadata:
      labels:
        app: gpu-model-serving
    spec:
      # Only schedule onto nodes actually labeled as GPU nodes.
      nodeSelector:
        accelerator: nvidia-gpu
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: gpu-model-serving
          image: ghcr.io/OWNER/REPO/gpu-model-serving:REPLACE_ME
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: MODEL_NAME
              value: distilgpt2
          resources:
            requests:
              cpu: "1"
              memory: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "2"
              memory: "8Gi"
              nvidia.com/gpu: "1"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-model-serving
  namespace: ml-serving
spec:
  selector:
    app: gpu-model-serving
  ports:
    - name: http
      port: 80
      targetPort: 8080
